<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/header.css">
    <link rel="stylesheet" href="./styles/footer.css">
    <link rel="icon" type="image/png" href="logos/logo_favicon.png">
    <link rel="stylesheet" href="styles/products.css">
    <title>Shop Ease</title>
</head>
<body>
    <Header>
        <div class = "nav-bar">
            <img src="/logos/logo.png" class="nav-logo">
            <div class="search-wrapper" >
                <input type="text" class="nav-search" placeholder="search for products">
                <button class="nav-search-button">search</button>
            </div>
            <div class="right-section">
                <div class="returns-and-orders">
                    <p class="returns-text">Returns</p>
                    <p class="orders-text">&amp; Orders</p>
                </div>
                <div class="cart">
                    <div class="cart-count" id = "cart-count">0</div>
                    <img src="images/cart-icon.png" alt="Shopping Cart" class="cart-icon">
                </div>
            </div>
        </div>
    </Header>

    <main>
        <div id="products-grid" class="products-grid"></div>
    </main>

    <footer class="footer">
        <div class="footer-container">

            <div class="footer-section">
                <h3>Get to Know Us</h3>
                <a href="#">About Us</a>
                <a href="#">Careers</a>
                <a href="#">Blog</a>
                <a href="#">Contact Us</a>
            </div>

            <div class="footer-section">
                <h3>Customer Service</h3>
                <a href="#">Help Center</a>
                <a href="#">Returns</a>
                <a href="#">Shipping</a>
                <a href="#">FAQs</a>
            </div>

            <div class="footer-section">
                <h3>Follow Us</h3>
                <a href="#">Facebook</a>
                <a href="#">Instagram</a>
                <a href="#">Twitter</a>
                <a href="#">LinkedIn</a>
            </div>

        </div>

        <hr>

        <p class="copyright">
            &copy; 2026 ShopEase. All Rights Reserved.
        </p>
    </footer>

    <script type="module" src="scripts/main.js"></script>
</body>
</html>
