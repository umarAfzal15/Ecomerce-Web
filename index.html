<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="icon" type="image/png" href="logos/logo_favicon.png">
    <link rel="stylesheet" href="styles/products.css">
    <title>Shop Ease</title>
</head>
<body>
    <Header>
        <div class = "nav-bar">
            <img src="/logos/logo.png" class="nav-logo">
            <div class="search-wrapper" >
                <input type="text" class="nav-search" placeholder="search for products">
                <button class="nav-search-button">search</button>
            </div>
            <div class="right-section">
                <div class="returns-and-orders">
                    <p class="returns-text">Returns</p>
                    <p class="orders-text">&amp; Orders</p>
                </div>
                <img src="images/cart-icon.png" alt="Shopping Cart" class="cart-icon">
            </div>
        </div>
    </Header>
    <main>
        <div id="products-grid" class="products-grid"></div>
    </main>
    <footer></footer>

    <script type="module" src="scripts/main.js"></script>
</body>
</html>
